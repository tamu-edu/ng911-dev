test_config:
  conformance:
    tests:
      - name: "CHFE_019"
        variations:
          - name: "Refer_To_TRANSFER_TARGET_SIP_URI"
            description: "Verify that a CHFE-generated SIP REFER contains a Refer-To with the target SIP URI and a suitable service URN"
            interfaces:
              - name: "IF_ESRP_CHFE"
                port_names: []
            params:
              messages:
                # Test System ESRP
                - action: "send"
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "api"
                      save_result_as: "var.esrp_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.esrp_api"
                        extract_field: "conference_id"
                      save_result_as: "var.conference_id"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      save_result_as: "var.chfe_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.chfe_api"
                        extract_field: "tel_number"
                      save_result_as: "var.CHFE_tel"
                  if_name: "IF_ESRP_CHFE"
                  if_port_name: ""
                  type: "SIP"
                  method: "INVITE"
                  response_code: "200"
                  http_url: ""
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_019/ESRP_CHFE_019.xml",
                    kwargs: {
                      set: {
                        conference_id: "var.conference_id",
                        CHFE_tel: "var.CHFE_tel"
                      }
                    },
                    save_response_as: "ESRP_CHFE_019_response.log",
                    save_log_as: "ESRP_CHFE_019.log"
                  }
                  run_in_background: "True"
                  next_action: "manual_chfe_transfer"

                # CHFE
                - action: "manual"
                  id: "manual_chfe_transfer"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  prompt: "MANUAL ACTION REQUIRED - please answer the incoming call on CHFE and then manually initiate a call transfer to SIP URI target(e.g. from a transfer directory, speed-dial list or dedicated transfer button). Press any key after the transfer has been initiated..."
                  next_action: ""

            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_ESRP_CHFE"
                dst_interface: "IF_CHFE_ESRP"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: ""
                body_contains: ""
              - message_type: "output"
                src_interface: "IF_CHFE_ESRP"
                dst_interface: "IF_ESRP_CHFE"
                sip_method: "REFER"
                http_request_method: ""
                response_status_code: ""
                header_contains: ""
                body_contains: ""

          - name: "Refer_To_TRANSFER_TARGET_TEL_NUM"
            description: "Verify that a CHFE-generated SIP REFER contains a Refer-To with a SIP URI (NOT a tel URI) and a suitable service URN"
            interfaces:
              - name: "IF_ESRP_CHFE"
                port_names: []
            params:
              messages:
                # Test System ESRP
                - action: "send"
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "api"
                      save_result_as: "var.esrp_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.esrp_api"
                        extract_field: "conference_id"
                      save_result_as: "var.conference_id"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      save_result_as: "var.chfe_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.chfe_api"
                        extract_field: "tel_number"
                      save_result_as: "var.CHFE_tel"
                  if_name: "IF_ESRP_CHFE"
                  if_port_name: ""
                  type: "SIP"
                  method: "INVITE"
                  response_code: "200"
                  http_url: ""
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_019/ESRP_CHFE_019.xml",
                    kwargs: {
                      set: {
                        conference_id: "var.conference_id",
                        CHFE_tel: "var.CHFE_tel"
                      }
                    },
                    save_response_as: "ESRP_CHFE_019_response.log",
                    save_log_as: "ESRP_CHFE_019.log"
                  }
                  run_in_background: "True"
                  next_action: "manual_chfe_transfer"

                # CHFE
                - action: "manual"
                  id: "manual_chfe_transfer"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  prompt: "MANUAL ACTION REQUIRED - please answer the incoming call on CHFE and then manually initiate a call transfer to a E.164 telephone number target. Press any key after the transfer has been initiated..."
                  next_action: ""

            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_ESRP_CHFE"
                dst_interface: "IF_CHFE_ESRP"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: ""
                body_contains: ""
              - message_type: "output"
                src_interface: "IF_CHFE_ESRP"
                dst_interface: "IF_ESRP_CHFE"
                sip_method: "REFER"
                http_request_method: ""
                response_status_code: ""
                header_contains: ""
                body_contains: ""

          - name: "Refer_To_TRANSFER_TARGET_LOCATION"
            description: "Verify that a CHFE-generated SIP REFER contains a Refer-To with a SIP URI returned by Test System ECRF-LVF"
            interfaces:
              - name: "IF_ESRP_CHFE"
                port_names: []
              - name: "IF_ECRF-LVF_CHFE"
                port_names: []
            params:
              messages:
                # Test System ECRF-LVF
                - action: "receive"
                  if_name: "IF_ECRF-LVF_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps: [ ]
                  type: "HTTP"
                  method: "POST"
                  response_code: "200"
                  http_url: "/lost"  # part after f.e. http://IP:PORT
                  body: "file.test_suite/test_files/HTTP_messages/HTTP_LoST/findServiceResponse.xml"
                  sipp_scenario: { }
                  run_in_background: "True"
                  next_action: "send_esrp"

                # Test System ESRP
                - action: "send"
                  id: "send_esrp"
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "api"
                      save_result_as: "var.esrp_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.esrp_api"
                        extract_field: "conference_id"
                      save_result_as: "var.conference_id"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      save_result_as: "var.chfe_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.chfe_api"
                        extract_field: "tel_number"
                      save_result_as: "var.CHFE_tel"
                  if_name: "IF_ESRP_CHFE"
                  if_port_name: ""
                  type: "SIP"
                  method: "INVITE"
                  response_code: "200"
                  http_url: ""
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_019/ESRP_CHFE_019.xml",
                    kwargs: {
                      set: {
                        conference_id: "var.conference_id",
                        CHFE_tel: "var.CHFE_tel"
                      }
                    },
                    save_response_as: "ESRP_CHFE_019_response.log",
                    save_log_as: "ESRP_CHFE_019.log"
                  }
                  run_in_background: "True"
                  next_action: "manual_chfe_transfer"

                # CHFE
                - action: "manual"
                  id: "manual_chfe_transfer"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  prompt: "MANUAL ACTION REQUIRED - please answer the incoming call on CHFE and then manually initiate a call transfer to a target based on any location entered also manually. Press any key after the transfer has been initiated..."
                  next_action: ""

            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_ESRP_CHFE"
                dst_interface: "IF_CHFE_ESRP"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: ""
                body_contains: ""
              - message_type: "output"
                src_interface: "IF_CHFE_ESRP"
                dst_interface: "IF_ESRP_CHFE"
                sip_method: "REFER"
                http_request_method: ""
                response_status_code: ""
                header_contains: ""
                body_contains: ""

        requirements:
          - name: "RQ_CHFE_281"
            variations: ["all"]
          - name: "RQ_CHFE_044"
            variations: ["all"]
          - name: "RQ_CHFE_045"
            variations: ["all"]
          - name: "RQ_CHFE_047"
            variations: ["all"]