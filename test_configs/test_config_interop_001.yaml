test_config:
  conformance:
    tests:
      - name: "INTEROP_001"
        variations:
          - name: "INTEROP_2.4_VAR_11_The_Request-URI_is_a_SIP_URI_with_a_911_telephone_number."
            description: "Interoperability test for Cellular emergency call with SIP URI 911 telephone number in the Request-URI"
            interfaces:
              - name: "IF_OSP_BCF"
                port_names: []
              - name: "IF_BCF_OSP"
                port_names: []
              - name: "IF_BCF_ESRP"
                port_names: []
              - name: "IF_BCF_CHFE"
                port_names: []
              - name: "IF_ESRP_BCF"
                port_names: []
              - name: "IF_ESRP_CHFE"
                port_names: []
              - name: "IF_PS_ESRP"
                port_names: []
              - name: "IF_LIS_ESRP"
                port_names: []
              - name: "IF_ECRF-LVF_ESRP"
                port_names: []
              - name: "IF_CHFE_LIS"
                port_names: []
              - name: "IF_CHFE_ESRP"
                port_names: []
              - name: "IF_CHFE_BCF"
                port_names: []
            params:
              messages:
                - action: "receive"
                  id: "receive_ps"
                  if_name: "IF_PS_ESRP"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_file"
                      "save_result_as": "var.esrp_certificate_file"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_key"
                      "save_result_as": "var.esrp_certificate_key"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_ESRP_BCF"
                      "save_result_as": "var.IF_ESRP_BCF"

                    # Prepare OriginationRoutePolicy for queue1
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "queue1@{0}"
                        variables: "list.[var.IF_ESRP_BCF,]"
                      save_result_as: "var.policy_queue_name"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/JSON/policy_object/Policy_object_OriginationRoutePolicy_LoSTServiceURN.json"
                        "param_name": "POLICY_QUEUE_NAME"
                        "value": "var.policy_queue_name"
                        "output_file": "file./tmp/INTEROP_001/Policy_object_OriginationRoutePolicy_LoSTServiceURN.json"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "tel_number"
                      "save_result_as": "var.CHFE_tel"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_ESRP"
                      "save_result_as": "var.IF_CHFE_ESRP"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "{0}@{1}"
                        variables: "list.[var.CHFE_tel, var.IF_CHFE_ESRP]"
                      save_result_as: "var.downstream_sip_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/Policy_object_OriginationRoutePolicy_LoSTServiceURN.json"
                        "param_name": "DOWNSTREAM_SIP_URI"
                        "value": "var.downstream_sip_uri"
                        "output_file": "file./tmp/INTEROP_001/Policy_object_OriginationRoutePolicy_LoSTServiceURN.json"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/Policy_object_OriginationRoutePolicy_LoSTServiceURN.json"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/origination_jws"

                      # Prepare ESRPNotify
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/XML/XACML_ESRPNotify.xml"
                        "param_name": "ALLOWED_FQDN"
                        "value": "var.IF_CHFE_ESRP"
                        "output_file": "file./tmp/INTEROP_001/XACML_ESRPNotify.xml"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_ESRP_CHFE"
                      "save_result_as": "var.IF_ESRP_CHFE"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_ESRPNotify.xml"
                        "param_name": "IUT_FQDN"
                        "value": "var.IF_ESRP_CHFE"
                        "output_file": "file./tmp/INTEROP_001/XACML_ESRPNotify.xml"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/XACML_ESRPNotify.xml"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/esrpnotify_jws"

                      # Prepare QueueState
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/XML/XACML_QueueState.xml"
                        "param_name": "ALLOWED_FQDN"
                        "value": "var.IF_CHFE_ESRP"
                        "output_file": "file./tmp/INTEROP_001/XACML_QueueState.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_QueueState.xml"
                        "param_name": "IUT_FQDN"
                        "value": "var.IF_ESRP_CHFE"
                        "output_file": "file./tmp/INTEROP_001/XACML_QueueState.xml"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/XACML_QueueState.xml"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/queuestate_jws"

                      # Prepare ElementState
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/XML/XACML_ElementState.xml"
                        "param_name": "ALLOWED_FQDN"
                        "value": "var.IF_CHFE_ESRP"
                        "output_file": "file./tmp/INTEROP_001/XACML_ElementState.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_ElementState.xml"
                        "param_name": "IUT_FQDN"
                        "value": "var.IF_ESRP_CHFE"
                        "output_file": "file./tmp/INTEROP_001/XACML_ElementState.xml"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/XACML_ElementState.xml"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/elementstate_jws"

                      # Prepare ServiceState
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/XML/XACML_ServiceState.xml"
                        "param_name": "ALLOWED_FQDN"
                        "value": "var.IF_CHFE_ESRP"
                        "output_file": "file./tmp/INTEROP_001/XACML_ServiceState.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_ServiceState.xml"
                        "param_name": "IUT_FQDN"
                        "value": "var.IF_ESRP_CHFE"
                        "output_file": "file./tmp/INTEROP_001/XACML_ServiceState.xml"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/XACML_ServiceState.xml"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/servicestate_jws"

                      # Prepare DequeueRegistration
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/XML/XACML_DequeueRegistration.xml"
                        "param_name": "ALLOWED_FQDN"
                        "value": "var.IF_CHFE_ESRP"
                        "output_file": "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                        "param_name": "IUT_FQDN"
                        "value": "var.IF_ESRP_CHFE"
                        "output_file": "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "lab_config['lab_config']['entities']"
                        "where_field": "name"
                        "where_value": "ESRP"
                        "extract_field": "interfaces"
                      "save_result_as": "var.esrp_interfaces"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.ecrf_interfaces"
                        "where_field": "name"
                        "where_value": "IF_ESRP_CHFE"
                        "extract_field": "port_mapping"
                      "save_result_as": "var.esrp_port_mapping"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.esrp_port_mapping"
                        "where_field": "protocol"
                        "where_value": "HTTP"
                        "extract_field": "port"
                      "save_result_as": "var.esrp_http_port"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                        "param_name": "IUT_PORT"
                        "value": "var.esrp_http_port"
                        "output_file": "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/XACML_DequeueRegistration.xml"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/dequeueregistration_jws"

                      # Prepare NormalNextHopRoutePolicy
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "chfe@{0}"
                        variables: "list.[var.IF_CHFE_ESRP,]"
                      save_result_as: "var.chfe_sip_uri"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "{0}@{1}"
                        variables: "list.[var.CHFE_tel, var.IF_CHFE_ESRP]"
                      save_result_as: "var.chfe_tel_sip_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/JSON/policy_object/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                        "param_name": "POLICY_QUEUE_NAME"
                        "value": "var.chfe_sip_uri"
                        "output_file": "file./tmp/INTEROP_001/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/INTEROP_001/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                        "param_name": "DOWNSTREAM_SIP_URI"
                        "value": "var.chfe_tel_sip_uri"
                        "output_file": "file./tmp/INTEROP_001/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/INTEROP_001/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        policy_array: True
                        output_file: "file./tmp/normalnexthop_jws"

                    # Prepare URL's
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "/Policies?policyType=OriginationRoutePolicy?policyQueueName=queue1@{0}"
                        variables: "list.[var.IF_ESRP_BCF,]"
                      save_result_as: "var.origination_url"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "/Policies?policyType=NormalNextHopRoutePolicy?policyQueueName=queue1@{0}"
                        variables: "list.[var.IF_ESRP_BCF,]"
                      save_result_as: "var.normalnexthop_url"
                  type: "HTTP"
                  method: ["GET", "GET", "GET", "GET", "GET", "GET", "GET",]
                  response_code: ["200", "200", "200", "200", "200", "200", "200",]
                  http_url: [
                              "/Versions",
                              "var.origination_url",
                              "/Policies?policyType=ESRPNotify",
                              "/Policies?policyType=QueueState",
                              "/Policies?policyType=ElementState",
                              "/Policies?policyType=ServiceState",
                              "/Policies?policyType=DequeueRegistration",
                              "var.normalnexthop_url",
                              ]
                  body: [
                          "file.test_suite/test_files/JSON/versions/Policy_Store_Versions_object_example_v010.3f.5.0.0.json",
                          "file./tmp/origination_jws",
