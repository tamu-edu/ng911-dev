                        output_certificate_file: "file./tmp/LOG_011/temp.crt"
                        output_key_file: "file./tmp/LOG_011/temp.key"
                        common_name: "var.IF_ESRP_LOG-write"
                    # Prepare payload
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "callid",
                        fqdn: "var.IF_ESRP_LOG-write",
                        set_default: "True"
                      }
                      save_result_as: "var.callid"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "incidentid",
                        fqdn: "var.IF_ESRP_LOG-write",
                        set_default: "True"
                      }
                      save_result_as: "var.incidentid"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/JSON/log_event/CallSignalingMessageLogEvent_example_v010.3f.3.0.1.json"
                        "param_name": "urn:emergency:uid:callid:123456789qwerty:bcf.ng911.test"
                        "value": "var.callid"
                        "output_file": "file./tmp/LOG_011/LogEvent_var2.json"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/LOG_011/LogEvent_var2.json"
                        "param_name": "urn:emergency:uid:incidentid:123456789qwerty:bcf.ng911.test"
                        "value": "var.incidentid"
                        "output_file": "file./tmp/LOG_011/LogEvent_var2.json"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/LOG_011/LogEvent_var2.json"
                        "param_name": "f81d4fae-7dec-11d0-a765-00a0c91e6bf6@osp.test"
                        "value": "var2f81d4fae-7dec-11d0-a765-00a0c91e6bf6@osp.test"
                        "output_file": "file./tmp/LOG_011/LogEvent_var2.json"
                    # Generate JWS
                    - method_name: "generate_jws"
                      kwargs:
                        json_source: "file./tmp/LOG_011/LogEvent_var2.json"
                        cert_path: "/tmp/LOG_011/temp.crt"
                        key_path: "/tmp/LOG_011/temp.key"
                        output_file: "file./tmp/jws_body"
                    # Send HTTP POST with LogEvent
                    - method_name: "send_http_request"
                      kwargs:
                        url: "var.log_url"
                        method: "POST"
                        content_type: "application/jose+json"
                        body: "file./tmp/jws_body"
