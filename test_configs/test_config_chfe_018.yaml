test_config:
  conformance:
    tests:
      - name: "CHFE_018"
        variations:
          - name: "CallStateChangeLogEvent_for_adding_party_to_the_conference"
            description: "Test covers logging of CallStateChangeLogEvent for adding party to the conference"
            interfaces:
              - name: "IF_BCF_CHFE"
                port_names: []
              - name: "IF_ESRP_CHFE"
                port_names: []
              - name: "IF_TS-CA_CHFE"
                port_names: [ ]
              - name: "IF_BRIDGE_CHFE"
                port_names: [ ]
              - name: "IF_LOG_CHFE"
                port_names: []
            params:
              messages:
                  # Test System ESRP
                - action: "receive"
                  if_name: "IF_ESRP_BCF"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_ESRP"
                      "save_result_as": "var.IF_BCF_ESRP"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_ESRP"
                      "save_result_as": "var.IF_CHFE_ESRP"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/FEs/ESRP_simple_call.xml",
                    kwargs: {
                      set: {
                        IF_BCF_ESRP: "var.IF_BCF_ESRP",
                        IF_CHFE_ESRP: "var.IF_CHFE_ESRP",
                      }
                    },
                    save_response_as: "ESRP_CHFE_018_response.log",
                    save_log_as: "ESRP_CHFE_018.log"
                  }
                  run_in_background: "True"

                # Test System Logging Service
                - action: "receive"
                  if_name: "IF_LOG_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "lab_config['lab_config']['entities']",
                        where_field: "name",
                        where_value: "LOG",
                        extract_field: 'interfaces'
                      }
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "var.log_interfaces",
                        where_field: "name",
                        where_value: "IF_LOG_CHFE",
                        extract_field: 'fqdn'
                      }
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "logid",
                        fqdn: "var.log_fqdn",
                        set_default: "True"
                      }
                      save_result_as: "var.logid"
                    - method_name: "save_to_file"
                      kwargs:
                        input_str: '{"logEventId": "test"}'
                        filename: "/tmp/chfe_018/logeventid.json"
                    - method_name: "modify_json_file"
                      kwargs:
                        json_input_file: "file./tmp/chfe_018/logeventid.json"
                        param_name: "logEventId"
                        value: "var.logid"
                        output_file: "file./tmp/chfe_018/logeventid.json"
                  type: "HTTP"
                  method: [ "POST", "GET" ]
                  response_code: [ "201", "200" ]
                  http_url: [ "/LogEvents", "/Versions" ] # part after f.e. http://IP:PORT
                  body: [ "file./tmp/chfe_018/logeventid.json", "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json" ]
                  sipp_scenario: { }
                  run_in_background: "True"

              # Test System Conference App
                - action: "receive"
                  if_name: "IF_TS-CA_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "TS-CA"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "conference_id"
                      "save_result_as": "var.conference_id"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BRIDGE_CHFE"
                      "save_result_as": "var.IF_BRIDGE_CHFE"
                  type: "SIP"
                  method: "INVITE"
                  response_code: "302"
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path:
                      "file.test_suite/test_files/SIPp_scenarios/SIP_RECEIVE/SIP_INVITE_RECEIVE_302_Moved_Contact.xml",
                    kwargs: {
                              set: {
                                     conference_id: "var.conference_id",
                                     BRIDGE_IP: "var.IF_BRIDGE_CHFE",
                                     BRIDGE_port: "5060"
                              }
                    },
                    save_response_as: "CHFE_018_TS-CA_response.log",
                    save_log_as: "CHFE_018_TS-CA_RECEIVE.log"
                  }
                  run_in_background: "True"

                  # Test System BRIDGE
                - action: "receive"
                  if_name: "IF_BRIDGE_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_BRIDGE"
                      "save_result_as": "var.IF_CHFE_BRIDGE"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BRIDGE_CHFE"
                      "save_result_as": "var.IF_BRIDGE_CHFE"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_BRIDGE"
                      "save_result_as": "var.IF_BCF_BRIDGE"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BRIDGE_BCF"
                      "save_result_as": "var.IF_BRIDGE_BCF"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "TS-CA"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "conference_id"
                      "save_result_as": "var.conference_id"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "tel_number"
                      "save_result_as": "var.CHFE_tel"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_018/BRIDGE_CHFE_018_var_1.xml",
                    kwargs: {
                      set: {
                             CHFE_tel: "var.CHFE_tel",
                             conference_id: "var.conference_id",
                             IF_CHFE_BRIDGE: "var.IF_CHFE_BRIDGE",
                             IF_BRIDGE_CHFE: "var.IF_BRIDGE_CHFE",
                             IF_BCF_BRIDGE: "var.IF_BCF_BRIDGE",
                             IF_BRIDGE_BCF: "var.IF_BRIDGE_BCF",
                      }
                    },
                    save_response_as: "BRIDGE_CHFE_018_response.log",
                    save_log_as: "BRIDGE_CHFE_018.log"
                  }
                  run_in_background: "True"

                # Test System BCF
                - action: "send"
                  if_name: "IF_BCF_ESRP"
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_ESRP"
                      "save_result_as": "var.IF_BCF_ESRP"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_CHFE"
                      "save_result_as": "var.IF_BCF_CHFE"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_BCF"
                      "save_result_as": "var.IF_CHFE_BCF"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BRIDGE_BCF"
                      "save_result_as": "var.IF_BRIDGE_BCF"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_BRIDGE"
                      "save_result_as": "var.IF_BCF_BRIDGE"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "callid",
                        fqdn: "var.IF_BCF_ESRP",
                        set_default: "True"
                      }
                      save_result_as: "var.callid"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "incidentid",
                        fqdn: "var.IF_BCF_ESRP",
                        set_default: "True"
                      }
                      save_result_as: "var.incidentid"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "TS-CA"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "conference_id"
                      "save_result_as": "var.conference_id"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_018/BCF_CHFE_018_var_1.xml"
                        "param_name": "urn:emergency:uid:callid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.callid"
                        "output_file": "file./tmp/CHFE_018/BCF_CHFE_018_var_1.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/CHFE_018/BCF_CHFE_018_var_1.xml"
                        "param_name": "urn:emergency:uid:incidentid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.incidentid"
                        "output_file": "file./tmp/CHFE_018/BCF_CHFE_018_var_1.xml"
                  if_port_name: ""  # Optional
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  sipp_scenario: {
                    scenario_file_path: "file./tmp/CHFE_018/BCF_CHFE_018_var_1.xml",
                    dependencies: [ ],
                    kwargs: { },
                    save_response_as: "CHFE_018_BCF_response.log",
                    save_log_as: "CHFE_018_BCF.log"
                  }
                  run_in_background: "False"
                  next_action: "manual_chfe"
                - action: "manual"
                  if_name: ""
                  id: "manual_chfe"
                  type: "SIP"
                  method: ""
                  instead: ""
                  prompt: "MANUAL ACTION REQUIRED - please answer incoming call on CHFE and manually trigger attended call transfer to any tel number. Press any key when done ..."
                  next_action: ""
            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_BCF_ESRP"
                dst_interface: "IF_ESRP_BCF"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: ""
                body_contains: ""
              - message_type: "other"
                src_interface: "IF_BRIDGE_BCF"
                dst_interface: "IF_BCF_BRIDGE"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: "Replaces:"
                body_contains: ""
              - message_type: "output"
                src_interface: "IF_CHFE_LOG"
                dst_interface: "IF_LOG_CHFE"
                sip_method: ""
                http_request_method: "POST"
                response_status_code: "201"
                header_contains: "/LogEvents"
                body_contains: ""
          - name: "CallStateChangeLogEvent_for_removing_party_from_the_conference"
            description: "Test covers logging of CallStateChangeLogEvent for removing party from the conference"
            interfaces:
              - name: "IF_BRIDGE_CHFE"
                port_names: [ ]
              - name: "IF_LOG_CHFE"
                port_names: []
            params:
              messages:
                # Test System Logging Service
                - action: "receive"
                  if_name: "IF_LOG_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "lab_config['lab_config']['entities']",
                        where_field: "name",
                        where_value: "LOG",
                        extract_field: 'interfaces'
                      }
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "var.log_interfaces",
                        where_field: "name",
                        where_value: "IF_LOG_CHFE",
                        extract_field: 'fqdn'
                      }
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "logid",
                        fqdn: "var.log_fqdn",
                        set_default: "True"
                      }
                      save_result_as: "var.logid"
                    - method_name: "save_to_file"
                      kwargs:
                        input_str: '{"logEventId": "test"}'
                        filename: "/tmp/chfe_018/logeventid.json"
                    - method_name: "modify_json_file"
                      kwargs:
                        json_input_file: "file./tmp/chfe_018/logeventid.json"
                        param_name: "logEventId"
                        value: "var.logid"
                        output_file: "file./tmp/chfe_018/logeventid.json"
                  type: "HTTP"
                  method: [ "POST", "GET" ]
                  response_code: [ "201", "200" ]
                  http_url: [ "/LogEvents", "/Versions" ] # part after f.e. http://IP:PORT
                  body: [ "file./tmp/chfe_018/logeventid.json", "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json" ]
                  sipp_scenario: { }
                  run_in_background: "True"

                  # Test System BRIDGE
                - action: "send"
                  if_name: "IF_BRIDGE_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_BRIDGE"
                      "save_result_as": "var.IF_CHFE_BRIDGE"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BRIDGE_CHFE"
                      "save_result_as": "var.IF_BRIDGE_CHFE"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "TS-CA"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "conference_id"
                      "save_result_as": "var.conference_id"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "api"
                      "save_result_as": "var.api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.api"
                        extract_field: "tel_number"
                      "save_result_as": "var.CHFE_tel"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_018/BRIDGE_CHFE_018_var_2.xml",
                    kwargs: {
                      set: {
                             CHFE_tel: "var.CHFE_tel",
                             conference_id: "var.conference_id",
                             IF_CHFE_BRIDGE: "var.IF_CHFE_BRIDGE",
                             IF_BRIDGE_CHFE: "var.IF_BRIDGE_CHFE",
                      }
                    },
                    save_response_as: "BRIDGE_CHFE_018_var_2_response.log",
                    save_log_as: "BRIDGE_CHFE_018_var_2.log"
                  }
                  run_in_background: "True"
                  next_action: "manual_chfe"

                - action: "manual"
                  if_name: ""
                  id: "manual_chfe"
                  type: "SIP"
                  method: ""
                  instead: ""
                  prompt: "MANUAL ACTION REQUIRED - please answer incoming call on CHFE. Press any key when done ..."
                  next_action: ""
            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_BRIDGE_CHFE"
                dst_interface: "IF_CHFE_BRIDGE"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: "200"
                header_contains: ""
                body_contains: ""
              - message_type: "output"
                src_interface: "IF_CHFE_LOG"
                dst_interface: "IF_LOG_CHFE"
                sip_method: ""
                http_request_method: "POST"
                response_status_code: "201"
                header_contains: "/LogEvents"
                body_contains: ""
        requirements:
          - name: "RQ_CHFE_359"
            variations: ["all"]
          - name: "RQ_CHFE_360"
            variations: ["all"]
