test_config:
  conformance:
    tests:
      - name: "CHFE_017"
        variations:
          - name: "HELD_dereference_response"
            description: "Validate the generation of a LocationResponseLogEvent to the Logging Service via HELD response with the log event payload containing all mandatory members"
            interfaces:
              - name: "IF_ESRP_CHFE"
                port_names: []
              - name: "IF_LIS_CHFE"
                port_names: []
              - name: "IF_LOG_CHFE"
                port_names: []
            params:
              messages:
                # Test system LIS
                - action: "receive"
                  if_name: "IF_LIS_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps: []
                  type: "HTTP"
                  method: "POST"
                  response_code: "200"
                  content_type: "application/held+xml"
                  http_url: "/heldLocationRequest"  # part after f.e. http://IP:PORT
                  body: "file.test_suite/test_files/HTTP_messages/HTTP_HELD/Location_response"
                  sipp_scenario: {}
                  run_in_background: "True"
                # Test system Logging Service
                - action: "receive"
                  if_name: "IF_LOG_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs: { config_part: "lab_config['lab_config']['entities']",
                                where_field: "name",
                                where_value: "LOG",
                                extract_field: 'interfaces' }
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs: { config_part: "var.log_interfaces",
                                where_field: "name",
                                where_value: "IF_LOG_CHFE",
                                extract_field: 'fqdn' }
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs: { identifier_type: "logid",
                                fqdn: "var.log_fqdn",
                                set_default: "True" }
                      save_result_as: "var.logid"
                    - method_name: "save_to_file"
                      kwargs:
                        input_str: '{"logEventId": "test"}'
                        filename: "file./tmp/chfe_017/logeventid.json"
                    - method_name: "modify_json_file"
                      kwargs:
                        json_input_file: "file./tmp/chfe_017/logeventid.json"
                        param_name: "logEventId"
                        value: "var.logid"
                        output_file: "file./tmp/chfe_017/logeventid.json"
                  type: "HTTP"
                  method: [ "POST", "GET" ]
                  response_code: [ "201", "200" ]
                  http_url: [ "/LogEvents", "/Versions" ] # part after f.e. http://IP:PORT
                  body: [ "file./tmp/chfe_017/logeventid.json", "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json" ]
                  sipp_scenario: {}
                  run_in_background: "True"
                # Test system ESRP
                - action: "send"
                  if_name: "IF_ESRP_CHFE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "lab_config['lab_config']['entities']"
                        "where_field": "name"
                        "where_value": "LIS"
                        "extract_field": "interfaces"
                      "save_result_as": "var.lis_interfaces"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.lis_interfaces"
                        "where_field": "name"
                        "where_value": "IF_LIS_CHFE"
                        "extract_field": "ip"
                      "save_result_as": "var.lis_ip"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.lis_interfaces"
                        "where_field": "name"
                        "where_value": "IF_LIS_CHFE"
                        "extract_field": "port_mapping"
                      "save_result_as": "var.lis_port_mapping"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.lis_port_mapping"
                        "where_field": "protocol"
                        "where_value": "HTTP"
                        "extract_field": "port"
                      "save_result_as": "var.lis_http_port"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "http://{0}:{1}/heldLocationRequest"
                        variables: "list.[var.lis_ip, var.lis_http_port]"
                      save_result_as: "var.http_url"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/SIPp_scenarios/SIP_INVITE/SIP_INVITE_geolocation_HELD.xml"
                        "param_name": "LIS_LOCATION_REFERENCE_URL"
                        "value": "var.http_url"
                        "output_file": "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_ESRP_CHFE"
                      "save_result_as": "var.IF_ESRP_CHFE"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "callid",
                        fqdn: "var.IF_ESRP_CHFE",
                        set_default: "True"
                      }
                      save_result_as: "var.callid"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "incidentid",
                        fqdn: "var.IF_ESRP_CHFE",
                        set_default: "True"
                      }
                      save_result_as: "var.incidentid"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml"
                        "param_name": "urn:emergency:uid:callid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.callid"
                        "output_file": "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml"
                        "param_name": "urn:emergency:uid:incidentid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.incidentid"
                        "output_file": "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file./tmp/CHFE_017/SIP_INVITE_geolocation_HELD.xml",
