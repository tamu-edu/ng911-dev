                port_names: []
            params:
              messages:
                - action: "send"
                  if_name: "IF_ESRP_PS"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_ESRP_PS"
                      save_result_as: "var.IF_ESRP_PS"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "/PolicyEnums?policyOwner=agency.test.example&policyType=OriginationRoutePolicy&policyQueueName=sip%3Aqueue1@{0}&start=1&limit=50&policiesUpdatedSince=2020-03-10T10%3A00%3A00-05%3A00"
                        variables: "list.[var.IF_ESRP_PS,]"
                      save_result_as: "var.url"
                  type: "HTTP"
                  method: "GET"
                  response_code: "200"
                  http_url: "var.url"  # part after f.e. http://IP:PORT
                  body: ""
