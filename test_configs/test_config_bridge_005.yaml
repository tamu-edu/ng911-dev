test_config:
  conformance:
    tests:
      - name: "BRIDGE_005"
        variations:
          - name: "SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only"
            description: "Validate a single multipart/mixed body containing exactly one SDP part"
            interfaces:
              - name: "IF_ESRP_BRIDGE"
                port_names: []
              - name: "IF_CHFE_BRIDGE"
                port_names: []
              - name: "IF_PS_BRIDGE"
                port_names: []
            params:
              messages:
                - action: "receive"
                  if_name: "IF_PS_BRIDGE"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "lab_config['lab_config']['entities']"
                        "where_field": "name"
                        "where_value": "BRIDGE"
                        "extract_field": "api"
                      "save_result_as": "var.api"
                    - "method_name": "extract_from_config"
                      "kwargs":
                        "config_part": "var.api"
                        "extract_field": "queue_sip_uri"
                      "save_result_as": "var.queue_sip_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/JSON/policy_object/Policy_object_OriginationRoutePolicy.json"
                        "param_name": "POLICY_QUEUE_NAME"
                        "value": "var.queue_sip_uri"
                        "output_file": "file./tmp/BRIDGE_005/policy.json"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_BRIDGE"
                      "save_result_as": "var.IF_CHFE_BRIDGE"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "service@{0}"
                        variables: "list.[var.IF_CHFE_BRIDGE,]"
                      save_result_as: "var.psap_sip_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/BRIDGE_005/policy.json"
                        "param_name": "DOWNSTREAM_SIP_URI"
                        "value": "var.psap_sip_uri"
                        "output_file": "file./tmp/BRIDGE_005/policy.json"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_file"
                      save_result_as: "var.esrp_certificate_file"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_key"
                      "save_result_as": "var.esrp_certificate_key"
                    - method_name: "generate_jws"
                      kwargs:
                        payload_source: "file./tmp/BRIDGE_005/policy.json"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        output_file: "file./tmp/jws_body"
                  type: "HTTP"
                  method: "GET"
                  response_code: "200"
                  http_url: "/Policies"  # part after f.e. http://IP:PORT
                  body: "file./tmp/jws_body"
                  sipp_scenario: {}
                  run_in_background: "True"
                  next_action: "manual_user_prompt"
                - action: "manual"
                  id: "manual_user_prompt"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  prompt: "MANUAL ACTION REQUIRED - please restart BRIDGE to trigger fetching policies from Test System Policy Store. Press any key when done or if device is already configured to route calls to Test System CHFE..."
                  next_action: "receive_chfe"
                - action: "receive"
                  id: "receive_chfe"
                  prep_steps: []
                  if_name: "IF_CHFE_BRIDGE"
                  if_port_name: ""  # Optional
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/SIP_RECEIVE/SIP_INVITE_RECEIVE.xml",
                    kwargs: {
                    },
                    save_response_as: "BRIDGE_005_var1_CHFE_response.log",
                    save_log_as: "BRIDGE_005_var1_CHFE.log"
                  }
                  run_in_background: "True"
                - action: "send"
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_ESRP_BRIDGE"
                      "save_result_as": "var.IF_ESRP_BRIDGE"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "callid",
                        fqdn: "var.IF_ESRP_BRIDGE",
                        set_default: "True"
                      }
                      save_result_as: "var.callid"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "incidentid",
                        fqdn: "var.IF_ESRP_BRIDGE",
                        set_default: "True"
                      }
                      save_result_as: "var.incidentid"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/SIPp_scenarios/SIP_INVITE/SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only.xml"
                        "param_name": "urn:emergency:uid:callid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.callid"
                        "output_file": "file./tmp/BRIDGE_005/SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only.xml"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/BRIDGE_005/SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only.xml"
                        "param_name": "urn:emergency:uid:incidentid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.incidentid"
                        "output_file": "file./tmp/BRIDGE_005/SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only.xml"
                  if_name: "IF_ESRP_BRIDGE"
                  if_port_name: ""  # Optional
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""  # part after f.e. http://IP:PORT
                  sipp_scenario: {
                    scenario_file_path: "file./tmp/BRIDGE_005/SIP_INVITE_from_ESRP_with_single_multipart_mixed_SDP_only.xml",
                    kwargs: {},
                    save_response_as: "BRIDGE_005_var1_ESRP_response.log",
                    save_log_as: "BRIDGE_005_var1_ESRP.log"
                  }
                  run_in_background: "False"
                  next_action: "manual_delay"
                - action: "manual"
                  id: "manual_delay"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  timeout: 5  # timeout in seconds
                  prompt: "Waiting 5 seconds until all SIP INVITE messages will be sent..."
            filtering_options:
              - message_type: "stimulus"
                src_interface: "IF_ESRP_BRIDGE"
                dst_interface: "IF_BRIDGE_ESRP"
                sip_method: "INVITE"
                http_request_method: ""
                response_status_code: ""
                header_contains: ""
                body_contains: ""
              - message_type: "output"
