test_config:
  conformance:
    tests:
      - name: "PS_014"
        variations:
          - name: "VersionsLogEvent"
            description: "VersionsLogEvent object verification"
            interfaces:
              - name: "IF_LOG_PS"
                port_names: []
            params:
              messages:
                - action: "receive"
                  if_name: "IF_LOG_PS"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "lab_config['lab_config']['entities']",
                        where_field: "name",
                        where_value: "LOG",
                        extract_field: 'interfaces'
                      }
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "var.log_interfaces",
                        where_field: "name",
                        where_value: "IF_LOG_PS",
                        extract_field: 'fqdn'
                      }
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "logid",
                        fqdn: "var.log_fqdn",
                        set_default: "True"
                      }
                      save_result_as: "var.logid"
                    - method_name: "save_to_file"
                      kwargs:
                        input_str: '{"logEventId": "test"}'
                        filename: "/tmp/PS_014/logeventid.json"
                    - method_name: "modify_json_file"
                      kwargs:
                        json_input_file: "file./tmp/PS_014/logeventid.json"
                        param_name: "logEventId"
                        value: "var.logid"
                        output_file: "file./tmp/PS_014/logeventid.json"
                  type: "HTTP"
                  method: [ "POST", "GET" ]
                  response_code: [ "201", "200" ]
                  http_url: [ "/LogEvents", "/Versions" ] # part after f.e. http://IP:PORT
                  body: [ "file./tmp/PS_014/logeventid.json", "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json" ]
                  sipp_scenario: { }
                  run_in_background: "True"
                  next_action: "manual_restart"
                - action: "manual"
                  id: "manual_restart"
                  if_name: ""
                  instead: ""
                  type: "SIP"
                  method: ""
                  prompt: "MANUAL ACTION REQUIRED - please restart Policy Store IUT to trigger sending of HTTP GET /Versions. Press any key when done..."
            filtering_options: # optional
                - message_type: "output" # stimulus/output/other
                  src_interface: "IF_PS_LOG"
                  dst_interface: "IF_LOG_PS"
                  sip_method: "" #  leave empty if not needed
                  http_request_method: "POST" #  leave empty if not needed
                  response_status_code: "201" #  leave empty if not needed
                  header_contains: "/LogEvents"
                  body_contains: ""
        requirements:
          - name: "RQ_PS_123"
            variations: ["all"]
