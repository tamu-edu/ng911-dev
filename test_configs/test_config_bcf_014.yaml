test_config:
  conformance:
    tests:
      - name: "BCF_014"
        variations:

          - name: "Audio_media"
            description: "Verify logging of anchored audio media using MediaStartLogEvent and MediaEndLogEvent"
            interfaces:
              - name: "IF_OSP_BCF"
                port_names: []
              - name: "IF_ESRP_BCF"
                port_names: []
              - name: "IF_LOG_BCF"
                port_names: []
            params:
              messages:

                # Test System ESRP
                - action: "receive"
                  prep_steps:
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_BCF_ESRP"
                      save_result_as: "var.IF_BCF_ESRP"
                  if_name: "IF_ESRP_BCF"
                  if_port_name: "IF_ESRP_BCF_SIP_5061_TLSv1.2"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""
                  body: ""
                  sipp_scenario: {
                    scenario_file_path: "file.test_suite/test_files/SIPp_scenarios/sip_service/CALLS/SIP_RECEIVE_basic_call_and_answer_with_SRTP_audio.xml",
                    kwargs: {
                      set: {
                        remote_media_ip: "var.IF_BCF_ESRP",
                      }
                    },
                    save_response_as: "BCF_014_var1_ESRP_response.log",
                    save_log_as: "BCF_014_var1_ESRP.log"
                  }
                  run_in_background: "True"

                # Test System Logging Service
                - action: "receive"
                  if_name: "IF_LOG_BCF"
                  if_port_name: ""
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "lab_config['lab_config']['entities']",
                        where_field: "name",
                        where_value: "LOG",
                        extract_field: "interfaces"
                      }
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs: {
                        config_part: "var.log_interfaces",
                        where_field: "name",
                        where_value: "IF_LOG_BCF",
                        extract_field: "fqdn"
                      }
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs: {
                        identifier_type: "logid",
                        fqdn: "var.log_fqdn",
                        set_default: "True"
                      }
                      save_result_as: "var.logid"
                    - method_name: "save_to_file"
                      kwargs:
                        input_str: '{"logEventId": "test"}'
                        filename: "/tmp/BCF_014/var1_logeventid.json"
                    - method_name: "modify_json_file"
                      kwargs:
                        json_input_file: "file./tmp/BCF_014/var1_logeventid.json"
                        param_name: "logEventId"
                        value: "var.logid"
                        output_file: "file./tmp/BCF_014/var1_logeventid.json"
                  type: "HTTP"
                  method: ["POST", "GET"]
                  response_code: ["201", "200"]
                  http_url: ["/LogEvents", "/Versions"]
                  body: [
                    "file./tmp/BCF_014/var1_logeventid.json",
                    "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json"
                  ]
                  sipp_scenario: {}
                  run_in_background: "True"

                # Test System OSP
                - action: "send"
                  prep_steps:
                    - "method_name": "get_interface_address"
                      "kwargs":
                        "interface_name": "IF_OSP_BCF"
                      "save_result_as": "var.IF_OSP_BCF"
                    - "method_name": "generate_identifier"
                      "kwargs":
                        "identifier_type": "callid"
                        "fqdn": "var.IF_OSP_BCF"
                        "set_default": "True"
                      "save_result_as": "var.callid"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/SIPp_scenarios/CALLS/SIP_basic_call_with_RTP.xml"
                        "param_name": "urn:emergency:uid:callid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.callid"
                        "output_file": "file./tmp/BCF_014/SIP_basic_call_with_RTP.xml"
                    - "method_name": "generate_identifier"
                      "kwargs":
                        "identifier_type": "incidentid"
                        "fqdn": "var.IF_OSP_BCF"
                        "set_default": "True"
                      "save_result_as": "var.incidentid"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/BCF_014/SIP_basic_call_with_RTP.xml"
                        "param_name": "urn:emergency:uid:incidentid:123ABCdefg123ABCdefg123ABCdefg12:test.com"
                        "value": "var.incidentid"
                        "output_file": "file./tmp/BCF_014/SIP_basic_call_with_RTP.xml"
                  if_name: "IF_OSP_BCF"
                  if_port_name: "IF_OSP_BCF_SIP_5060_TCP"
                  type: "SIP"
                  method: "INVITE"
                  response_code: ""
                  http_url: ""
                  sipp_scenario: {
                    scenario_file_path: "file./tmp/BCF_014/SIP_basic_call_with_RTP.xml",
                    dependencies: ["file.test_suite/test_files/SIPp_scenarios/CALLS/g711ulaw_rtp_stream.pcap"],
                    kwargs: {},
                    save_response_as: "BCF_014_var1_OSP_response.log",
                    save_log_as: "BCF_014_var1_OSP.log"
                  }
                  run_in_background: "False"
                  next_action: "var1_log_wait"

