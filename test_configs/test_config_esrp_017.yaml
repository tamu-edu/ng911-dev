test_config:
  conformance:
    tests:
      - name: "ESRP_017"
        variations:
          - name: "NormalNextHopRoutePolicy"
            description: "Test ESRP logging for RouteLogEvent for NormalNextHopRoutePolicy"
            interfaces:
              - name: "IF_BCF_ESRP"
                port_names: []
              - name: "IF_LOG_ESRP"
                port_names: []
              - name: "IF_PS_ESRP"
                port_names: []
              - name: "IF_CHFE_ESRP"
                port_names: []
            params:
              messages:
                - action: "receive"
                  if_name: "IF_PS_ESRP"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "CHFE"
                        extract_field: "interfaces"
                      "save_result_as": "var.chfe_interfaces"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.chfe_interfaces"
                        where_field: "name"
                        where_value: "IF_CHFE_ESRP"
                        extract_field: "port_mapping"
                      save_result_as: "var.chfe_port_mapping"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.chfe_port_mapping"
                        where_field: "protocol"
                        where_value: "SIP"
                        extract_field: "port"
                      save_result_as: "var.chfe_port"
                    - method_name: "get_interface_address"
                      kwargs:
                        interface_name: "IF_CHFE_ESRP"
                      "save_result_as": "var.IF_CHFE_ESRP"
                    - method_name: "generate_str"
                      kwargs:
                        string_to_modify: "sip:chfe@{0}:{1}"
                        variables: "list.[var.IF_CHFE_ESRP, var.chfe_port]"
                      save_result_as: "var.chfe_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file.test_suite/test_files/JSON/policy_object/Policy_object_RoutePolicy_NormalNextHop_v010.3f.5.0.0.json"
                        "param_name": "sip:DOWNSTREAM_SIP_URI"
                        "value": "var.chfe_uri"
                        "output_file": "file./tmp/ESRP_017/policy.json"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "api"
                      save_result_as: "var.esrp_api"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.esrp_api"
                        extract_field: "queue_sip_uri"
                      "save_result_as": "var.esrp_queue_sip_uri"
                    - "method_name": "replace_string_in_file"
                      "kwargs":
                        "input_file": "file./tmp/ESRP_017/policy.json"
                        "param_name": "POLICY_QUEUE_NAME"
                        "value": "var.esrp_queue_sip_uri"
                        "output_file": "file./tmp/ESRP_017/policy.json"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_file"
                      save_result_as: "var.esrp_certificate_file"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "ESRP"
                        extract_field: "certificate_key"
                      "save_result_as": "var.esrp_certificate_key"
                    - method_name: "generate_jws"
                      kwargs:
                        json_source: "file./tmp/ESRP_017/policy.json"
                        cert_path: "var.esrp_certificate_file"
                        key_path: "var.esrp_certificate_key"
                        output_file: "file./tmp/jws_body"
                  type: "HTTP"
                  method: "GET"
                  response_code: "200"
                  http_url: "/Policies"  # part after f.e. http://IP:PORT
                  body: "file./tmp/jws_body"
                  sipp_scenario: {}
                  run_in_background: "True"
                - action: "receive"
                  if_name: "IF_LOG_ESRP"
                  if_port_name: ""  # Optional
                  prep_steps:
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "lab_config['lab_config']['entities']"
                        where_field: "name"
                        where_value: "LOG"
                        extract_field: "interfaces"
                      save_result_as: "var.log_interfaces"
                    - method_name: "extract_from_config"
                      kwargs:
                        config_part: "var.log_interfaces"
                        where_field: "name"
                        where_value: "IF_LOG_ESRP"
                        extract_field: "fqdn"
                      save_result_as: "var.log_fqdn"
                    - method_name: "generate_identifier"
                      kwargs:
                        identifier_type: "logid"
                        fqdn: "var.log_fqdn"
                        set_default: "True"
