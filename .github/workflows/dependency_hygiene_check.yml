name: Dependency Hygiene Check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  DEPTRY_VERSION: "0.25.1"
  ARTIFACT_RETENTION_DAYS: "14"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test_suite/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r test_suite/requirements.txt
          python -m pip install "deptry==${DEPTRY_VERSION}"

      - name: Run dependency hygiene
        id: deptry
        run: |
          set +e
          deptry test_suite proxy_server \
            --requirements-files test_suite/requirements.txt \
            --json-output deptry-report.json
          EXIT_CODE=$?
          set -e

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "Deptry exit code: ${EXIT_CODE}"

      - name: Validate dependency hygiene report
        id: report
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("deptry-report.json")
          output = Path(os.environ["GITHUB_OUTPUT"])

          if not report.exists() or report.stat().st_size == 0:
              print("Dependency hygiene assessment incomplete: report was not produced.")
              with output.open("a", encoding="utf-8") as f:
                  f.write("valid=false\n")
                  f.write("issues=0\n")
              raise SystemExit(1)

          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"Dependency hygiene assessment incomplete: invalid JSON report: {exc}")
              with output.open("a", encoding="utf-8") as f:
                  f.write("valid=false\n")
                  f.write("issues=0\n")
              raise SystemExit(1)

          if not isinstance(data, list):
              print("Dependency hygiene assessment incomplete: expected a JSON list.")
              with output.open("a", encoding="utf-8") as f:
                  f.write("valid=false\n")
                  f.write("issues=0\n")
              raise SystemExit(1)

          with output.open("a", encoding="utf-8") as f:
              f.write("valid=true\n")
              f.write(f"issues={len(data)}\n")

          print(f"Dependency hygiene report is valid. Findings: {len(data)}")
          PY

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Dependency Hygiene Check"
            echo
            if [ "${{ steps.report.outputs.valid }}" = "true" ]; then
              echo "- Assessment: completed"
              echo "- Findings: ${{ steps.report.outputs.issues }}"
              echo "- Deptry exit code: ${{ steps.deptry.outputs.exit_code }}"
            else
              echo "- Assessment: incomplete"
              echo "- Findings: unavailable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-hygiene-report
          path: deptry-report.json
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

      - name: Comment PR with dependency hygiene summary
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = "<!-- DEPTRY_HYGIENE_COMMENT -->";

            let valid = "${{ steps.report.outputs.valid }}" === "true";
            let issues = [];

            if (valid) {
              try {
                const raw = fs.readFileSync("deptry-report.json", "utf8");
                issues = JSON.parse(raw);
                if (!Array.isArray(issues)) {
                  valid = false;
                  issues = [];
                }
              } catch (e) {
                valid = false;
                issues = [];
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            for (const comment of comments) {
              if (comment.body && comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id
                });
              }
            }

            if (valid && issues.length === 0) {
              console.log("Dependency hygiene check passed — skipping comment.");
              return;
            }

            let body;

            if (!valid) {
              body = "## ⚠️ Dependency Hygiene Assessment Incomplete\n\n";
              body += "Deptry did not produce a valid report. The result is treated as a failed assessment rather than as zero findings.\n\n";
            } else {
              body = "## ❌ Dependency Hygiene Issues Detected\n\n";
              body += `Total issues detected: **${issues.length}**\n\n`;

              const types = {};
              for (const issue of issues) {
                const code = issue.error?.code || "UNKNOWN";
                types[code] = (types[code] || 0) + 1;
              }

              if (Object.keys(types).length > 0) {
                body += "**Breakdown:**\n";
                for (const [code, count] of Object.entries(types)) {
                  body += `- ${code}: ${count}\n`;
                }
                body += "\n";
              }
            }

            body += `📎 Full report and logs: ${runUrl}\n\n`;
            body += marker;

            await github.rest.issues.createComment({
              owner, repo, issue_number, body
            });

      - name: Enforce dependency hygiene gate
        if: always()
        run: |
          if [ "${{ steps.report.outputs.valid }}" != "true" ]; then
            echo "Dependency hygiene assessment incomplete."
            exit 1
          fi

          if [ "${{ steps.report.outputs.issues }}" -ne 0 ]; then
            echo "Dependency hygiene gate failed with ${{ steps.report.outputs.issues }} issue(s)."
            exit 1
          fi

          echo "Dependency hygiene gate passed."