lab_config:
  pca_certificate_file: ""  # TLS certificate file for secure connections
  pca_certificate_key: ""   # TLS private key matching the certificate
  test_suite_host_ip: "192.168.1.75"    # IP of the machine running the test suite
  entities:
    # Test System ESRP
    - name: "ESRP"
      mode: "STUB_SERVER"
      function: "ESRP"
      role: ["SENDER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api: # PCAP fixture values
        conference_id: "test_conference_id"
      interfaces:
        - name: "IF_ESRP_CHFE"
          fqdn: ""
          ip: "192.168.1.50"            # Interface IP address
          mask: "255.255.255.0"          # Network mask
          gateway: ""  #  Leave empty if not required
          dns: [ ]  #  Leave empty if not required
          port_mapping:
            - name: "IF_ESRP_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
    # IUT CHFE
    - name: "CHFE"
      mode: "REAL_DEVICE"
      function: "CHFE"
      role: [ "IUT" ]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api: # PCAP fixture values
        tel_number: "+12025550119"
      interfaces:
        - name: "IF_CHFE_ESRP"
          fqdn: ""
          ip: "172.16.0.100"             # Interface IP address
          mask: "255.255.255.0"          # Network mask
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_ESRP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_CHFE_ECRF-LVF"
          fqdn: ""
          ip: "172.16.0.100"
          mask: "255.255.255.0"
          gateway: ""  #  Leave empty if not required
          dns: []  #  Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_ECRF-LVF_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"

    # Test System ECRF-LVF
    - name: "ECRF-LVF"
      mode: "STUB_SERVER"
      function: "ECRF-LVF"
      role: ["RECEIVER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api_http_url_prefix: "/lost"  # Optional
      interfaces:
        - name: "IF_ECRF-LVF_CHFE"
          fqdn: ""
          ip: "10.10.0.130"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_ECRF-LVF_CHFE_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
            - name: "IF_ECRF-LVF_CHFE_HTTPS_443_TLSv1.2"
              protocol: "HTTPS"
              port: 443
              transport_protocol: "TLSv1.2"
