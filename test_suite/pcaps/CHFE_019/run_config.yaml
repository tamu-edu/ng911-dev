run_config:
  output_folder: test_suite/pcaps/CHFE_019/results/
  global:
    type: conformance
    report_files:
      output_folder_path: ''
      prefix: TAMU
      suffix: test
      detailed_view: true
      types:
      - docx
      - pdf
    id_summary:
      lab:
        name: Test LAB
        accred_status: Accredited
        accred_ref: '123412'
        accred_auth: '12344'
        addr_line_1: '1'
        addr_line_2: '2'
        city: Web
        state: Internet
        country: Earth
        zip: '001001'
        url: www
        eng_name: ENTER NAME
      supplier:
        name: ENTER NAME
        addr_line_1: '1'
        addr_line_2: '2'
        city: Web
        state: Internet
        country: Earth
        zip: '001001'
        url: www
      iut:
        type: CHFE
        name: IUT_CHFE
        version: 0.0.0.1
        date_of_receipt: 10.07.2026
        location: Web
        cs_id: '11111'
        cs_static_conform: false
      test_env:
        ixit_id: '11111'
        test_method: test_method
        spec_name: STA-010
        spec_version: '3.0'
        test_period_start: 10.07.2026
        test_period_end: 10.07.2026
        log_ref: '123412'
        log_ret_date: '1234124'
    log:
      level: DEBUG
      output_file: test_suite/pcaps/CHFE_019/results//CHFE_019_logger.log
      dev_mode: false
    comments:
    - author: Lab
      comment: this is test env
    - author: ENTER NAME
      comment: This is my own test env
  tests:
  - name: CHFE_11111
    requirements:
    - name: RQ_CHFE_281
      variations:
      - Refer_To_serviceurn_parameter
    variations:
    - name: Refer_To_serviceurn_parameter
      description: Verify that a CHFE-generated SIP REFER contains a suitable service
        URN in the serviceurn parameter of the Refer-To header field
      interfaces:
      - name: IF_ESRP_CHFE
        port_names: []
      mode: pcap
      pcap_file: test_suite/pcaps/CHFE_019/TC_CHFE_019_var1_pass_Refer_To_serviceurn_parameter.pcap
      ssl_keys_file_path: ''
      params:
        messages:
        - action: send
          prep_steps:
          - method_name: extract_from_config
            kwargs:
              config_part: lab_config['lab_config']['entities']
              where_field: name
              where_value: ESRP
              extract_field: api
            save_result_as: var.esrp_api
          - method_name: extract_from_config
            kwargs:
              config_part: var.esrp_api
              extract_field: conference_id
            save_result_as: var.conference_id
          - method_name: extract_from_config
            kwargs:
              config_part: lab_config['lab_config']['entities']
              where_field: name
              where_value: CHFE
              extract_field: api
            save_result_as: var.chfe_api
          - method_name: extract_from_config
            kwargs:
              config_part: var.chfe_api
              extract_field: tel_number
            save_result_as: var.CHFE_tel
          if_name: IF_ESRP_CHFE
          if_port_name: ''
          type: SIP
          method: INVITE
          response_code: '200'
          http_url: ''
          body: ''
          sipp_scenario:
            scenario_file_path: file.test_suite/test_files/SIPp_scenarios/sip_service/CHFE_019/ESRP_CHFE_019.xml
            kwargs:
              set:
                conference_id: var.conference_id
                CHFE_tel: var.CHFE_tel
            save_response_as: ESRP_CHFE_019_response.log
            save_log_as: ESRP_CHFE_019.log
          run_in_background: 'True'
          next_action: manual_chfe_transfer
        - action: manual
          id: manual_chfe_transfer
          if_name: ''
          instead: ''
          type: SIP
          method: ''
          prompt: MANUAL ACTION REQUIRED - please answer the incoming call on CHFE
            and then manually initiate a call transfer to another device. Press any
            key after the transfer has been initiated...
          next_action: ''
      filtering_options:
      - message_type: stimulus
        src_interface: IF_ESRP_CHFE
        dst_interface: IF_CHFE_ESRP
        sip_method: INVITE
        http_request_method: ''
        response_status_code: '200'
        body_contains: ''
        header_contains: ''
      - message_type: output
        src_interface: IF_CHFE_ESRP
        dst_interface: IF_ESRP_CHFE
        sip_method: REFER
        http_request_method: ''
        response_status_code: ''
        body_contains: ''
        header_contains: ''
    preamble_list: []
    postamble_list: []
