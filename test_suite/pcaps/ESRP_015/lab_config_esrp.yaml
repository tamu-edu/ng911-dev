lab_config:
  pca_certificate_file: ""       # PCA-issued certificate for TLS auth
  pca_certificate_key: ""        # Key matching PCA certificate
  test_suite_host_ip: "192.168.1.59"         # Test suite host IP (controller)
  entities:
    # Test System BCF
    - name: "BCF"
      mode: "STUB_SERVER"
      function: "BCF"
      role: ["OTHER", "SENDER"]
      fqdn: ""                   # Fully Qualified Domain Name
      certificate_file: ""       # TLS certificate
      certificate_key: ""        #
      interfaces:
        - name: "IF_BCF_OSP"
          fqdn: ""
          ip: "192.168.1.10"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]               # Leave empty if not required
          port_mapping:
            - name: "IF_BCF_OSP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_BCF_ESRP"
          fqdn: ""
          ip: "192.168.1.10"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]               # Leave empty if not required
          port_mapping:
            - name: "IF_BCF_ESRP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
    - name: "ESRP"    # ESRP Under Test
      mode: "REAL_DEVICE"
      function: "ESRP"
      role: ["IUT"]
      fqdn: ""
      certificate_file: "test_suite/pcaps/ESRP_015/PCA_certificate1.pem"       # TLS certificate
      certificate_key: "test_suite/pcaps/ESRP_015/PCA_key1.pem"        #
      interfaces:
        - name: "IF_ESRP_BCF"
          fqdn: ""
          ip: "192.168.1.50"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]                # Leave empty if not required
          port_mapping:
            - name: "IF_ESRP_BCF_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_ESRP_LOG"
          fqdn: ""
          ip: "192.168.1.50"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]                # Leave empty if not required
          port_mapping:
            - name: "IF_ESRP_LOG_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
    # Test System LOG
    - name: "LOG"             # Simulated log service
      mode: "STUB_SERVER"     # Acts as a stub server for HTTP requests
      function: "LOG"
      role: [ "RECEIVER" ]          # Sends HTTP messages
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      interfaces:
        - name: "IF_LOG_ESRP"   # Interface between LOG and BCF
          fqdn: ""
          ip: "10.10.0.111"            # Interface IP address
          mask: "255.255.255.0"          # Network mask
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_LOG_ESRP_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"