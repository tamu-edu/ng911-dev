# TD_PS_016 / RQ_PS_060 — PCAP package launch config CANDIDATE.
# Based on the current templates/ALL_TESTS/PS/launch_config.yaml.
# Review report metadata and actual lab config runtime paths before publishing.
launch_config:
  output_folder: "/tmp/lab_tests/"
  global_config:
    lab_info: "templates/ALL_TESTS/lab_info.yaml"
    type: "conformance"
    log:
      level: "DEBUG"
      output_file: "PS_DEBUG.log"
    report_files:
      prefix: "PS"
      suffix: "PS_016_PCAPS"
      output_folder_path: ""
      detailed_view: true
      types:
        - "docx"
        - "pdf"
    id_summary:
      eng_name: "ENTER NAME"
      supplier:
        name: "ENTER SUPPLIER NAME"
        addr_line_1: "ENTER ADDRESS"
        addr_line_2: ""
        city: "ENTER CITY"
        state: "ENTER STATE"
        country: "ENTER COUNTRY"
        zip: "ENTER ZIP CODE"
        url: "ENTER URL"
      test_env:
        ixit_id: "11111"
        test_method: "test_method"
        test_period_start: "ENTER CURRENT DATE"
        test_period_end: "ENTER CURRENT DATE"
        log_ref: "00001"
        log_ret_date: "ENTER CURRENT DATE"
    comments:
      - author: "ENTER AUTHOR NAME"
        comment: "THIS IS A TEST RUN ONLY, RESULTS ARE NOT VALID!"
  tests:
    - iut:
        type: "PS"
        name: "IF_PS_ESRP"
        version: "0.0.0.1"
        date_of_receipt: "ENTER CURRENT DATE"
        location: "ENTER LOCATION"
        cs_id: "CS00001"
      lab_config: "test_suite/pcaps/PS_016/TC_PS_016_lab_config.yaml"
      requirements:
        - "RQ_PS_060"
