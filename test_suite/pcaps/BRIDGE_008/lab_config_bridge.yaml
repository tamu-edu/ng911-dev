lab_config:
  pca_certificate_file: ""  # TLS certificate file for secure connections
  pca_certificate_key: ""   # TLS private key matching the certificate
  test_suite_host_ip: "192.168.50.10"    # IP of the machine running the test suite
  entities:
    # Test System CHFE
    - name: "CHFE"
      mode: "STUB_SERVER"
      function: "CHFE"
      role: ["RECEIVER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api:
        tel_number: ""
      interfaces:
        - name: "IF_CHFE_BRIDGE"
          fqdn: ""
          ip: "192.168.50.30"
          mask: "255.255.255.0"
          gateway: ""  # Leave empty if not required
          dns: [ ]  # Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_BRIDGE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
    # Bridge device under test
    - name: "BRIDGE"          # Bridge device under test
      mode: "REAL_DEVICE"     # Physical/real device in the testbed
      function: "BRIDGE"      # Conference bridge function
      role: ["IUT"]             # Implementation Under Test
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api:
        conference_sip_uri_username: ""  # SIP username for conference API
        queue_sip_uri: ""
      interfaces:
        - name: "IF_BRIDGE_CHFE"
          fqdn: ""
          ip: "192.168.50.20"
          mask: "255.255.255.0"
          gateway: ""  # Leave empty if not required
          dns: [ ]  # Leave empty if not required
          port_mapping:
            - name: "IF_BRIDGE_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_BRIDGE_LOG"
          fqdn: ""
          ip: "192.168.50.20"
          mask: "255.255.255.0"
          gateway: ""  # Leave empty if not required
          dns: [ ]  # Leave empty if not required
          port_mapping:
            - name: "IF_BRIDGE_LOG_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
    # Test System LOG
    - name: "LOG"             # Simulated log service
      mode: "STUB_SERVER"     # Acts as a stub server for HTTP requests
      function: "LOG"
      role: ["RECEIVER"]          # Receives HTTP requests from BRIDGE
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      interfaces:
        - name: "IF_LOG_BRIDGE"
          fqdn: ""
          ip: "192.168.50.10"
          mask: "255.255.255.0"
          gateway: ""  # Leave empty if not required
          dns: [ ]  # Leave empty if not required
          port_mapping:
            - name: "IF_LOG_BRIDGE_HTTP_8080_TCP"
              protocol: "HTTP"   # Receives HTTP requests from BRIDGE
              port: 8080
              transport_protocol: "TCP"
