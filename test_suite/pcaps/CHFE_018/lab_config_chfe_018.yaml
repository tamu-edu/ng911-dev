lab_config:
  pca_certificate_file: ""  # TLS certificate file for secure connections
  pca_certificate_key: ""   # TLS private key matching the certificate
  test_suite_host_ip: "192.168.1.55"    # IP of the machine running the test suite
  entities:
    # Test System BCF
    - name: "BCF"
      mode: "STUB_SERVER"
      function: "BCF"
      role: [ "OTHER", "SENDER" ]
      fqdn: ""                   # Fully Qualified Domain Name
      certificate_file: ""       # TLS certificate
      certificate_key: ""        # TLS key
      interfaces:
        - name: "IF_BCF_ESRP"
          fqdn: ""
          ip: "192.168.1.10"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]               # Leave empty if not required
          port_mapping:
            - name: "IF_BCF_ESRP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        # direct BCF<->CHFE leg
        - name: "IF_BCF_CHFE"
          fqdn: ""
          ip: "192.168.1.10"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_BCF_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        # BCF<->BRIDGE leg
        - name: "IF_BCF_BRIDGE"
          fqdn: ""
          ip: "192.168.1.10"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_BCF_BRIDGE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
    # Test System ESRP
    - name: "ESRP"
      mode: "STUB_SERVER"
      function: "ESRP"
      role: ["SENDER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
