    "variations":
    - "name": "Logging of ServiceStateChangeLogEvent on ECRF-LVF Security Posture\
        \ change"
      "description": "Verify that ECRF/LVF acts as a ServiceState notification server\
        \ and logs a valid ServiceStateChangeLogEvent when reporting Security Posture\
        \ state changes."
      "interfaces":
      - "name": "IF_ESRP_ECRF-LVF"
        "port_names": []
      - "name": "IF_LOG_ECRF-LVF"
        "port_names": []
      "mode": "pcap"
      "pcap_file": "test_suite/pcaps/ECRF_LVF_010/ECRF_LVF_010_v1_pass.pcap"
      "ssl_keys_file_path": ""
      "params":
        "messages":
        - "action": "receive"
          "if_name": "IF_LOG_ECRF-LVF"
          "if_port_name": ""
          "prep_steps":
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "lab_config['lab_config']['entities']"
              "where_field": "name"
              "where_value": "LOG"
              "extract_field": "interfaces"
            "save_result_as": "var.log_interfaces"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.log_interfaces"
              "where_field": "name"
              "where_value": "IF_LOG_ECRF-LVF"
              "extract_field": "fqdn"
            "save_result_as": "var.log_fqdn"
          - "method_name": "generate_identifier"
            "kwargs":
              "identifier_type": "logid"
              "fqdn": "var.log_fqdn"
              "set_default": "True"
            "save_result_as": "var.logid"
          - "method_name": "save_to_file"
            "kwargs":
              "input_str": "{\"logEventId\": \"test\"}"
              "filename": "/tmp/ECRF-LVF_010/logeventid.json"
          - "method_name": "modify_json_file"
            "kwargs":
              "json_input_file": "file./tmp/ECRF-LVF_010/logeventid.json"
              "param_name": "logEventId"
              "value": "var.logid"
              "output_file": "file./tmp/ECRF-LVF_010/logeventid.json"
          "type": "HTTP"
          "method":
          - "POST"
          - "GET"
          "response_code":
          - "201"
          - "200"
          "http_url":
          - "/LogEvents"
          - "/Versions"
          "body":
          - "file./tmp/ECRF-LVF_010/logeventid.json"
          - "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json"
          "sipp_scenario": {}
          "run_in_background": "True"
        - "action": "send"
          "if_name": "IF_ESRP_ECRF-LVF"
          "if_port_name": ""
          "id": "send_subscribe_servicestate"
          "prep_steps":
          - "method_name": "get_interface_address"
            "kwargs":
              "interface_name": "IF_ESRP_ECRF-LVF"
            "save_result_as": "var.IF_ESRP_ECRF-LVF"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "lab_config['lab_config']['entities']"
              "where_field": "name"
              "where_value": "ECRF-LVF"
              "extract_field": "interfaces"
            "save_result_as": "var.ecrf_interfaces"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.ecrf_interfaces"
              "where_field": "name"
              "where_value": "IF_ECRF-LVF_ESRP"
              "extract_field": "ip"
            "save_result_as": "var.ecrf_ip"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.ecrf_interfaces"
              "where_field": "name"
              "where_value": "IF_ECRF-LVF_ESRP"
              "extract_field": "fqdn"
            "save_result_as": "var.ecrf_fqdn"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.ecrf_interfaces"
              "where_field": "name"
              "where_value": "IF_ECRF-LVF_ESRP"
              "extract_field": "port_mapping"
            "save_result_as": "var.ecrf_port_mapping"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.ecrf_port_mapping"
              "where_field": "protocol"
              "where_value": "HTTP"
              "extract_field": "port"
            "save_result_as": "var.ecrf_port"
          - "method_name": "generate_url"
            "kwargs":
              "protocol": "http"
              "address": "list.[var.ecrf_fqdn, var.ecrf_ip]"
              "port": "var.ecrf_port"
              "path": "/LoST"
            "save_result_as": "var.ecrf_url"
          "type": "SIP"
          "method": "SUBSCRIBE"
          "response_code": ""
          "http_url": ""
          "body": ""
          "sipp_scenario":
            "scenario_file_path": "file./tmp/ECRF-LVF_010/SIP_SUBSCRIBE_ServiceState.xml"
            "kwargs": {}
            "save_response_as": "ECRF-LVF_010_var1_ServiceState_response.log"
            "save_log_as": "ECRF-LVF_010_var1_ServiceState.log"
          "run_in_background": "True"
        - "action": "manual"
          "if_name": ""
          "instead": ""
          "type": "SIP"
          "method": ""
          "prompt": "MANUAL ACTION REQUIRED - please simulate change of Security Posture\
            \ to 'Orange' and press any key to continue..."
          "next_action": "send_subscribe_servicestate"
