  "tests":
  - "name": "LOG_CS00001"
    "requirements":
    - "name": "RQ_LOG_197"
      "variations":
      - "Tampered_payload_signature_mismatch"
      - "Untrusted_certificate_signature"
      - "Corrupted_signature_value"
    - "name": "RQ_LOG_198"
      "variations":
      - "Tampered_payload_signature_mismatch"
      - "Untrusted_certificate_signature"
      - "Corrupted_signature_value"
    "variations":
    - "name": "Tampered_payload_signature_mismatch"
      "description": "Validate 434 warning response (not error/retry) for a LogEvent whose\
        \ payload was altered after signing, so the signature no longer matches the\
        \ content. Confirm the event is still recorded via GET /IncidentIds."
      "interfaces":
      - "name": "IF_ESRP_LOG-write"
        "port_names": []
      - "name": "IF_ESRP_LOG-read"
        "port_names": []
      "mode": "pcap"
      "pcap_file": "test_suite/pcaps/LOG_011/TC_LOG_011_var1_pass_Tampered_payload_signature_mismatch_434.pcap"
      "ssl_keys_file_path": ""
      "params":
        "messages":
        - "action": "send"
          "if_name": "IF_ESRP_LOG-read"
          "if_port_name": ""
          "prep_steps": []
          "type": "HTTP"
          "method": "GET"
          "response_code": "200"
          "http_url": "/IncidentIds"
          "body": ""
          "sipp_scenario": {}
          "run_in_background": "False"
      "filtering_options":
      - "message_type": "stimulus"
        "src_interface": "IF_ESRP_LOG-write"
        "dst_interface": "IF_LOG-write_ESRP"
        "sip_method": ""
        "http_request_method": "POST"
        "response_status_code": "434"
        "body_contains": "Signature Verification Failed"
        "header_contains": "/LogEvents"
      - "message_type": "other"
        "src_interface": "IF_ESRP_LOG-read"
        "dst_interface": "IF_LOG-read_ESRP"
        "sip_method": ""
        "http_request_method": "GET"
        "response_status_code": "200"
        "body_contains": "urn:emergency:uid:incidentid:1111111111qwertyuiop:bcf.ng911.test"
        "header_contains": "/IncidentIds"
    - "name": "Untrusted_certificate_signature"
      "description": "Validate 434 warning response (not error/retry) for a LogEvent\
        \ JWS signed with a certificate/key not trusted by the Logging Service's configured\
        \ PCA/CA. Confirm the event is still recorded via GET /IncidentIds."
      "interfaces":
      - "name": "IF_ESRP_LOG-write"
        "port_names": []
      - "name": "IF_ESRP_LOG-read"
        "port_names": []
      "mode": "pcap"
      "pcap_file": "test_suite/pcaps/LOG_011/TC_LOG_011_var2_pass_Untrusted_certificate_signature_434.pcap"
      "ssl_keys_file_path": ""
      "params":
        "messages":
        - "action": "send"
          "if_name": "IF_ESRP_LOG-read"
          "if_port_name": ""
          "prep_steps": []
          "type": "HTTP"
          "method": "GET"
          "response_code": "200"
          "http_url": "/IncidentIds"
          "body": ""
          "sipp_scenario": {}
          "run_in_background": "False"
      "filtering_options":
      - "message_type": "stimulus"
        "src_interface": "IF_ESRP_LOG-write"
        "dst_interface": "IF_LOG-write_ESRP"
        "sip_method": ""
        "http_request_method": "POST"
        "response_status_code": "434"
        "body_contains": "Signature Verification Failed"
        "header_contains": "/LogEvents"
      - "message_type": "other"
        "src_interface": "IF_ESRP_LOG-read"
        "dst_interface": "IF_LOG-read_ESRP"
        "sip_method": ""
        "http_request_method": "GET"
        "response_status_code": "200"
        "body_contains": "urn:emergency:uid:incidentid:2222222222qwertyuiop:bcf.ng911.test"
        "header_contains": "/IncidentIds"
    - "name": "Corrupted_signature_value"
      "description": "Validate 434 warning response (not error/retry) for a LogEvent\
        \ JWS with a corrupted/truncated signature segment. Confirm the event is still\
        \ recorded via GET /IncidentIds."
      "interfaces":
