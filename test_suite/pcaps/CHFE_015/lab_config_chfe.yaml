lab_config:
  pca_certificate_file: ""  # TLS certificate file for secure connections
  pca_certificate_key: ""   # TLS private key matching the certificate
  test_suite_host_ip: "192.168.1.75"    # IP of the machine running the test suite
  entities:
    # Test System ESRP
    - name: "ESRP"
      mode: "STUB_SERVER"
      function: "ESRP"
      role: ["SENDER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      interfaces:
        - name: "IF_ESRP_CHFE"
          fqdn: ""
          ip: "192.168.1.76"            # Interface IP address
          mask: "255.255.255.0"          # Network mask
          gateway: ""  #  Leave empty if not required
          dns: [ ]  #  Leave empty if not required
          port_mapping:
            - name: "IF_ESRP_CHFE_SIP_5061_TLSv1.2"
              protocol: "SIP"
              port: 5061
              transport_protocol: "TLSv1.2"
            - name: "IF_ESRP_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
    # IUT CHFE
    - name: "CHFE"
      mode: "REAL_DEVICE"
      function: "CHFE"
      role: [ "IUT" ]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
     # api:
      #  tel_number: ""
      interfaces:
        - name: "IF_CHFE_ESRP"
          fqdn: ""
          ip: "172.16.0.100"             # Interface IP address
          mask: "255.255.255.0"          # Network mask
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_ESRP_SIP_5061_TLSv1.2"
              protocol: "SIP"
              port: 5061
              transport_protocol: "TLSv1.2"
            - name: "IF_CHFE_ESRP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_CHFE_LIS"
          fqdn: ""
          ip: "172.16.0.101"
          mask: "255.255.255.0"
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_LIS_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
            - name: "IF_CHFE_LIS_HTTP_8080_TCP"
              protocol: "HTTP" # For HELD POST requests to LIS
              port: 8080       # Common alternative HTTP port
              transport_protocol: "TCP"
        - name: "IF_CHFE_LOG"
          fqdn: ""
          ip: "172.16.0.102"
          mask: "255.255.255.0"
          gateway: ""  #  Leave empty if not required
          dns: [ ]  #  Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_LOG_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
    # Test System LIS
    - name: "LIS"             # Location Information Server (can receive HELD or SIP SUBSCRIBE)
      mode: "STUB_SERVER"
      function: "LIS"
      role: [ "RECEIVER" ]
      fqdn: ""
      certificate_file: "test_suite/pcaps/CHFE_015/PCA-cacert.pem"
      certificate_key: "test_suite/pcaps/CHFE_015/PCA-cakey.pem"
      interfaces:
        - name: "IF_LIS_CHFE"
          fqdn: ""
          ip: "192.168.1.79"
          mask: "255.255.255.0"
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_LIS_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
            - name: "IF_LIS_CHFE_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
    # Test System LOG
    - name: "LOG"             # Simulated log service
      mode: "STUB_SERVER"     # Acts as a stub server for HTTP requests
      function: "LOG"
      role: [ "RECEIVER" ]          # Sends HTTP messages
      fqdn: ""
      certificate_file: "test_suite/pcaps/LOG_004/cert_PCA/PCA.crt"
      certificate_key: "test_suite/pcaps/LOG_004/cert_PCA/PCA.key"
      interfaces:
        - name: "IF_LOG_CHFE"   # Interface between LOG and BCF
          fqdn: ""
          ip: "192.168.1.80"            # Interface IP address
          mask: "255.255.255.128"          # Network mask
          gateway: ""         # Leave empty if not required
          dns: [ ]            # Leave empty if not required
          port_mapping:
            - name: "IF_LOG_CHFE_HTTP_8080_TCP"
              protocol: "HTTP"
              port: 8080
              transport_protocol: "TCP"
