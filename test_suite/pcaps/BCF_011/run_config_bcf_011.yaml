            "kwargs": {}
            "save_response_as": "BCF_011_var1_ESRP_response.log"
            "save_log_as": "BCF_011_var1_ESRP.log"
          "run_in_background": "True"
        - "action": "send"
          "if_name": "IF_OSP_BCF"
          "if_port_name": "IF_OSP_BCF_SIP_5061_TLSv1.2"
          "prep_steps":
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "lab_config['lab_config']['entities']"
              "where_field": "name"
              "where_value": "OSP"
              "extract_field": "certificate_file"
            "save_result_as": "var.osp_certificate_file"
