          "method": "INVITE"
          "response_code": ""
          "http_url": ""
          "sipp_scenario":
            "scenario_file_path": "file.test_suite/test_files/SIPp_scenarios/sip_service/SIP_INVITE/SIP_basic_call_with_SRTP.xml"
            "kwargs": {}
            "save_response_as": "BCF_011_var1_OSP_response.log"
            "save_log_as": "BCF_011_var1_OSP.log"
          "run_in_background": "False"
          "next_action": "manual_delay"
        - "action": "manual"
