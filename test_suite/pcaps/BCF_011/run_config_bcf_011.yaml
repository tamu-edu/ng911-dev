      "params":
        "messages":
        - "action": "receive"
          "prep_steps": []
          "if_name": "IF_ESRP_BCF"
          "if_port_name": "IF_ESRP_BCF_SIP_5061_TLSv1.2"
          "type": "SIP"
          "method": "INVITE"
          "response_code": ""
