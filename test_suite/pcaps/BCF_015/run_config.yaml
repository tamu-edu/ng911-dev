  "tests":
  - "name": "BCF_CS00001"
    "requirements":
    - "name": "RQ_BCF_156"
      "variations":
      - "LogEvents_POST_parameters"
    "variations":
    - "name": "LogEvents_POST_parameters"
      "description": "Validate BCF LogEvents POST request properties defined by RQ_BCF_156."
      "interfaces":
      - "name": "IF_OSP_BCF"
        "port_names": []
      - "name": "IF_ESRP_BCF"
        "port_names": []
      - "name": "IF_LOG_BCF"
        "port_names": []
      "mode": "pcap"
      "pcap_file": "test_suite/pcaps/BCF_015/TC_BCF_015_var1_pass_LogEvents_POST_parameters.pcap"
      "ssl_keys_file_path": ""
      "params":
        "messages":
        - "action": "receive"
          "prep_steps": []
          "if_name": "IF_ESRP_BCF"
          "if_port_name": "IF_ESRP_BCF_SIP_5060_TCP"
          "type": "SIP"
          "method": "INVITE"
          "response_code": ""
          "http_url": ""
          "body": ""
          "sipp_scenario":
            "scenario_file_path": "file.test_suite/test_files/SIPp_scenarios/CALLS/SIP_RECEIVE_basic_call_and_answer.xml"
            "kwargs": {}
            "save_response_as": "BCF_015_ESRP_response.log"
            "save_log_as": "BCF_015_ESRP.log"
          "run_in_background": "True"
        - "action": "receive"
          "if_name": "IF_LOG_BCF"
          "if_port_name": "IF_LOG_BCF_HTTP_8080_TCP"
          "prep_steps":
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "lab_config['lab_config']['entities']"
              "where_field": "name"
              "where_value": "LOG"
              "extract_field": "interfaces"
            "save_result_as": "var.log_interfaces"
          - "method_name": "extract_from_config"
            "kwargs":
              "config_part": "var.log_interfaces"
              "where_field": "name"
              "where_value": "IF_LOG_BCF"
              "extract_field": "fqdn"
            "save_result_as": "var.log_fqdn"
          - "method_name": "generate_identifier"
            "kwargs":
              "identifier_type": "logid"
              "fqdn": "var.log_fqdn"
            "save_result_as": "var.logid"
          - "method_name": "save_to_file"
            "kwargs":
              "input_str": "{\"logEventId\": \"test\"}"
              "filename": "/tmp/bcf_015/logeventid.json"
          - "method_name": "modify_json_file"
            "kwargs":
              "json_input_file": "file./tmp/bcf_015/logeventid.json"
              "param_name": "logEventId"
              "value": "var.logid"
              "output_file": "file./tmp/bcf_015/logeventid.json"
          "type": "HTTP"
          "method":
          - "POST"
          - "GET"
          "response_code":
          - "201"
          - "200"
          "http_url":
          - "/LogEvents"
          - "/Versions"
          "body":
          - "file./tmp/bcf_015/logeventid.json"
          - "file.test_suite/test_files/JSON/versions/Logging_Service_Versions_object_example_v010.3f.5.0.0.json"
          "sipp_scenario": {}
          "run_in_background": "True"
        - "action": "send"
          "prep_steps": []
          "if_name": "IF_OSP_BCF"
          "if_port_name": "IF_OSP_BCF_SIP_5060_TCP"
          "type": "SIP"
          "method": "INVITE"
          "response_code": ""
          "http_url": ""
          "body": ""
          "sipp_scenario":
            "scenario_file_path": "file.test_suite/test_files/SIPp_scenarios/CALLS/SIP_basic_call_from_OSP.xml"
            "kwargs": {}
            "save_response_as": "BCF_015_OSP_response.log"
            "save_log_as": "BCF_015_OSP.log"
          "run_in_background": "False"
          "next_action": "timeout"
        - "action": "manual"
          "id": "timeout"
          "if_name": ""
          "instead": ""
          "type": "SIP"
          "method": ""
          "timeout": 5
          "prompt": "Waiting 5 seconds until IUT will send all LogEvents..."
          "next_action": ""
      "filtering_options":
      - "message_type": "stimulus"
        "src_interface": "IF_OSP_BCF"
        "dst_interface": "IF_BCF_OSP"
        "sip_method": "INVITE"
