launch_config:
  output_folder: "results"
  global_config:
    lab_info: "templates/ALL_TESTS/lab_info.yaml"
    type: "conformance"
    log:
      level: "DEBUG"
      output_file: "ECRF_LVF_013_DEBUG.log"
    report_files:
      prefix: "ECRF_LVF_013"
      suffix: "PCAP_TEST_RUN"
      output_folder_path: ""
      detailed_view: true
      types:
        - "docx"
        - "pdf"
    id_summary:
      eng_name: "ENTER NAME"
      supplier:
        name: "ENTER SUPPLIER NAME"
        addr_line_1: "ENTER ADDRESS"
        addr_line_2: ""
        city: "ENTER CITY"
        state: "ENTER STATE"
        country: "ENTER COUNTRY"
        zip: "ENTER ZIP CODE"
        url: "ENTER URL"
      test_env:
        ixit_id: "11111"
        test_method: "PCAP"
        test_period_start: "ENTER CURRENT DATE"
        test_period_end: "ENTER CURRENT DATE"
        log_ref: "00001"
        log_ret_date: "ENTER CURRENT DATE"
    comments:
      - author: "ENTER NAME"
        comment: "THIS IS A TEST RUN ONLY, RESULTS ARE NOT VALID!"
  tests:
    - iut:
        type: "ECRF-LVF"
        name: "ECRF-LVF"
        version: "0.0.0.1"
        date_of_receipt: "ENTER CURRENT DATE"
        location: "ENTER LOCATION"
        cs_id: "CS00001"
      lab_config: "test_suite/pcaps/ECRF_LVF_013/lab_config_ecrf_lvf.yaml"
      requirements: ["RQ_ECRF-LVF_056"]
