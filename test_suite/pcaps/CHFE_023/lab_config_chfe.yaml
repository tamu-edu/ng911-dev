lab_config:
  pca_certificate_file: ""  # TLS certificate file for secure connections
  pca_certificate_key: ""   # TLS private key matching the certificate
  test_suite_host_ip: "192.168.1.50" # IP of the machine running the test suite
  entities:
    - name: "CHFE"
      mode: "REAL_DEVICE"
      function: "CHFE"
      role: ["IUT"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api:
        tel_number: ""
      interfaces:
        - name: "IF_CHFE_ESRP"
          fqdn: ""
          ip: "192.168.1.51"
          mask: "255.255.255.0"
          gateway: ""            # Leave empty if not required
          dns: [ ]               # Leave empty if not required
          port_mapping:
            - name: "IF_CHFE_ESRP_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
        - name: "IF_CHFE_BRIDGE"
          fqdn: ""
          ip: "192.168.1.51"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_CHFE_BRIDGE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"

    - name: "ESRP"
      mode: "STUB_SERVER"
      function: "ESRP"
      role: ["SENDER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      api: { }
      interfaces:
        - name: "IF_ESRP_CHFE"
          fqdn: ""
          ip: "192.168.1.52"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_ESRP_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"

    - name: "BRIDGE"
      mode: "STUB_SERVER"
      function: "BRIDGE"
      role: ["RECEIVER"]
      fqdn: ""
      certificate_file: ""
      certificate_key: ""
      #api:
        # value to provision on the CHFE as Conference Factory URI (IXIT).
        # conference_factory_uri: "sip:conf-factory@<IF_Bridge_CHFE>"
      interfaces:
        - name: "IF_BRIDGE_CHFE"
          fqdn: ""
          ip: "192.168.1.53"
          mask: "255.255.255.0"
          gateway: ""
          dns: [ ]
          port_mapping:
            - name: "IF_BRIDGE_CHFE_SIP_5060_TCP"
              protocol: "SIP"
              port: 5060
              transport_protocol: "TCP"
