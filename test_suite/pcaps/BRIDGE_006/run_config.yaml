      comment: THIS IS A TEST RUN ONLY, RESULTS ARE NOT VALID!
  tests:
  - name: BRIDGE_CS00001
    requirements:
    - name: RQ_BRG_006
      variations:
      - Outgoing_SIP_INVITE_to_a_secondary_PSAP
    - name: RQ_BRG_009
      variations:
      - Outgoing_SIP_INVITE_to_a_secondary_PSAP
    - name: RQ_BRG_010
      variations:
      - Outgoing_SIP_INVITE_to_a_secondary_PSAP
    - name: RQ_BRG_079
      variations:
      - Outgoing_SIP_INVITE_to_a_secondary_PSAP
    variations:
    - name: Outgoing_SIP_INVITE_to_a_secondary_PSAP
      description: Validate outgoing SIP INVITE to the secondary PSAP while adding
        to the conference
      interfaces:
      - name: IF_CHFE_BRIDGE
        port_names: []
      - name: IF_CHFE-2_BRIDGE
        port_names: []
      mode: pcap
      pcap_file: test_suite/pcaps/BRIDGE_006/TC_BRIDGE_006_var1_pass_Outgoing_SIP_INVITE_to_a_secondary_PSAP.pcap
      ssl_keys_file_path: ''
      params:
        messages:
        - action: receive
          if_name: IF_CHFE-2_BRIDGE
          if_port_name: ''
          prep_steps: []
          type: SIP
          method: INVITE
          response_code: ''
          http_url: ''
          body: ''
          sipp_scenario:
            scenario_file_path: file.test_suite/test_files/SIPp_scenarios/SIP_RECEIVE/SIP_INVITE_RECEIVE_100_Trying.xml
            kwargs: {}
            save_response_as: CHFE-2_BRIDGE_006_response.log
            save_log_as: CHFE-2_BRIDGE_006.log
          run_in_background: 'True'
        - action: send
          if_name: IF_CHFE_BRIDGE
          if_port_name: ''
          prep_steps:
          - method_name: extract_from_config
            kwargs:
              config_part: lab_config['lab_config']['entities']
              where_field: name
              where_value: CHFE
              extract_field: api
            save_result_as: var.api
          - method_name: extract_from_config
            kwargs:
              config_part: var.api
              extract_field: tel_number
            save_result_as: var.CHFE_tel
          - method_name: get_interface_address
            kwargs:
              interface_name: IF_BRIDGE_CHFE
            save_result_as: var.IF_BRIDGE_CHFE
          - method_name: get_interface_address
            kwargs:
              interface_name: IF_CHFE-2_BRIDGE
            save_result_as: var.IF_CHFE-2_BRIDGE
          - method_name: get_interface_address
            kwargs:
              interface_name: IF_CHFE_BRIDGE
            save_result_as: var.IF_CHFE_BRIDGE
          - method_name: generate_identifier
            kwargs:
              identifier_type: callid
              fqdn: var.IF_CHFE_BRIDGE
              set_default: 'True'
            save_result_as: var.callid
          - method_name: generate_identifier
            kwargs:
              identifier_type: incidentid
              fqdn: var.IF_CHFE_BRIDGE
              set_default: 'True'
            save_result_as: var.incidentid
          - method_name: replace_string_in_file
            kwargs:
              input_file: file.test_suite/test_files/SIPp_scenarios/sip_service/BRIDGE_006/CHFE_BRIDGE_006.xml
              param_name: urn:emergency:uid:callid:123ABCdefg123ABCdefg123ABCdefg12:test.com
              value: var.callid
              output_file: file.test_suite/test_files/SIPp_scenarios/sip_service/_tmp_CHFE_BRIDGE_006.xml
          - method_name: replace_string_in_file
            kwargs:
              input_file: file.test_suite/test_files/SIPp_scenarios/sip_service/_tmp_CHFE_BRIDGE_006.xml
              param_name: urn:emergency:uid:incidentid:123ABCdefg123ABCdefg123ABCdefg12:test.com
              value: var.incidentid
              output_file: file.test_suite/test_files/SIPp_scenarios/sip_service/_tmp_CHFE_BRIDGE_006.xml
          type: SIP
          method: INVITE
          response_code: '200'
          http_url: ''
          body: ''
          sipp_scenario:
            scenario_file_path: file.test_suite/test_files/SIPp_scenarios/sip_service/_tmp_CHFE_BRIDGE_006.xml
            kwargs:
              set:
                CHFE_tel: var.CHFE_tel
                IF_BRIDGE_CHFE: var.IF_BRIDGE_CHFE
                IF_CHFE2_BRIDGE: var.IF_CHFE-2_BRIDGE
            save_response_as: CHFE_BRIDGE_006_response.log
            save_log_as: CHFE_BRIDGE_006.log
          run_in_background: 'False'
      filtering_options:
      - message_type: stimulus
        src_interface: IF_CHFE_BRIDGE
        dst_interface: IF_BRIDGE_CHFE
        sip_method: REFER
        http_request_method: ''
        response_status_code: ''
        body_contains: ''
        header_contains: ''
      - message_type: output
        src_interface: IF_BRIDGE_CHFE-2
        dst_interface: IF_CHFE-2_BRIDGE
        sip_method: INVITE
        http_request_method: ''
        response_status_code: '100'
        body_contains: ''
        header_contains: ''
    preamble_list: []
    postamble_list: []
